<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Change could not be submitted · Shelfarr</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: #fbf7f0;
        --surface: #fffdf9;
        --ink: #211c16;
        --muted: #665b4e;
        --line: #e6dccb;
        --accent: #a33a22;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #16130f;
          --surface: #211c17;
          --ink: #f2eadd;
          --muted: #b3a797;
          --line: #38302a;
          --accent: #ee9270;
        }
      }

      body {
        max-inline-size: 38rem;
        margin: 0 auto;
        padding: 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-block: 0.5rem 1.25rem;
        color: var(--accent);
        font: 600 1.5rem Georgia, serif;
      }

      header svg {
        flex: none;
      }

      main {
        margin-block-start: clamp(1rem, 9vw, 5rem);
        padding: clamp(1rem, 5vw, 2rem);
        border: 1px solid var(--line);
        border-radius: 1.5rem;
        background: var(--surface);
      }

      h1 {
        margin: 0 0 0.75rem;
        font: 600 clamp(1.75rem, 1.25rem + 2vw, 2.5rem) / 1.1 Georgia, serif;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .error-code {
        margin-block-start: 1rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <header>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" focusable="false">
        <path d="M4 4h5v16H4zM10 7h4v13h-4zM16 4l4-1 3 16-4 1z"/>
      </svg>
      shelfarr
    </header>
    <main>
      <h1>Change could not be submitted</h1>
      <p>Go back and reload the form before trying again.</p>
      <p class="error-code">Error 422</p>
    </main>
  </body>
</html>
