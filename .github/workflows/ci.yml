name: CI

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run quality gate
        env:
          RAILS_ENV: test
        run: bin/quality push

  companion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Restore locked dependencies
        working-directory: services/libation_companion
        run: >-
          dotnet restore
          tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj
          --locked-mode
          --nologo

      - name: Verify formatting
        working-directory: services/libation_companion
        run: |
          dotnet format src/Shelfarr.Libation.Companion/Shelfarr.Libation.Companion.csproj --no-restore --verify-no-changes
          dotnet format tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj --no-restore --verify-no-changes

      - name: Run tests
        working-directory: services/libation_companion
        run: >-
          dotnet test
          tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj
          --configuration Release
          --no-restore
          --nologo

      - name: Smoke test container
        working-directory: services/libation_companion
        run: ./tests/container-smoke.sh

  filesystem-contracts:
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cifs-utils libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run CIFS filesystem contracts
        run: test/filesystem_contracts/cifs-smoke.sh

  container:
    needs: [quality, companion, filesystem-contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Shelfarr image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha,scope=shelfarr
          cache-to: type=gha,mode=max,scope=shelfarr

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          bundler-cache: true

      - name: Audit gems
        run: bin/bundler-audit --update
