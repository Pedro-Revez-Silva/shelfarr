name: CI

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y iptables libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run quality gate
        env:
          RAILS_ENV: test
        run: bin/quality push

  companion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Restore locked dependencies
        working-directory: services/libation_companion
        run: >-
          dotnet restore
          tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj
          --locked-mode
          --nologo

      - name: Verify formatting
        working-directory: services/libation_companion
        run: |
          dotnet format src/Shelfarr.Libation.Companion/Shelfarr.Libation.Companion.csproj --no-restore --verify-no-changes
          dotnet format tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj --no-restore --verify-no-changes

      - name: Run tests
        working-directory: services/libation_companion
        run: >-
          dotnet test
          tests/Shelfarr.Libation.Companion.Tests/Shelfarr.Libation.Companion.Tests.csproj
          --configuration Release
          --no-restore
          --nologo

      - name: Smoke test container
        working-directory: services/libation_companion
        run: ./tests/container-smoke.sh

  filesystem-contracts:
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cifs-utils libvips

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Prepare test database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run CIFS filesystem contracts
        run: test/filesystem_contracts/cifs-smoke.sh

  container:
    needs: [quality, companion, filesystem-contracts]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Shelfarr image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: |
            APP_VERSION=ci
          cache-from: type=gha,scope=shelfarr
          cache-to: type=gha,mode=max,scope=shelfarr

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Audit gems
        run: bin/bundler-audit --update
