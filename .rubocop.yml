# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

require:
  - ./lib/rubocop/cop/shelfarr/skipped_test.rb
  - ./lib/rubocop/cop/shelfarr/root_relative_path.rb
  - ./lib/rubocop/cop/shelfarr/rescue_to_empty.rb

Shelfarr/SkippedTest:
  Enabled: true
  Severity: warning
  Include:
    - "test/**/*_test.rb"

Shelfarr/RootRelativePath:
  Enabled: true
  Severity: warning
  Include:
    - "app/views/**/*.erb"
    - "app/javascript/**/*.js"
    - "app/controllers/**/*.rb"

Shelfarr/RescueToEmpty:
  Enabled: true
  Severity: warning
  Include:
    - "app/services/**/*.rb"
    - "app/jobs/**/*.rb"
  # These files already rescue to [], nil, or false. Rewriting them changes
  # search, download, and filesystem results, which this pull request does not do.
  # A file that is not listed here is checked.
  Exclude:
    - "app/jobs/cleanup_temp_files_job.rb"
    - "app/jobs/download_job.rb"
    - "app/jobs/download_monitor_job.rb"
    - "app/jobs/hardcover_subscription_sync_job.rb"
    - "app/jobs/health_check_job.rb"
    - "app/jobs/owned_media_backup_job.rb"
    - "app/jobs/post_processing_job.rb"
    - "app/jobs/post_processing_recovery_job.rb"
    - "app/jobs/search_job.rb"
    - "app/jobs/telegram_polling_job.rb"
    - "app/jobs/upload_processing_job.rb"
    - "app/services/anna_archive_client.rb"
    - "app/services/audiobook_bundle_import_planner.rb"
    - "app/services/audiobook_image_probe_service.rb"
    - "app/services/audiobook_probe_service.rb"
    - "app/services/book_metadata_lookup_service.rb"
    - "app/services/book_orbit_client.rb"
    - "app/services/comic_vine_client.rb"
    - "app/services/connection_error_classifier.rb"
    - "app/services/custom_acquisition_provider_client.rb"
    - "app/services/direct_download_file_service.rb"
    - "app/services/download_client_selector.rb"
    - "app/services/download_clients/deluge.rb"
    - "app/services/download_clients/nzbget.rb"
    - "app/services/download_clients/qbittorrent.rb"
    - "app/services/download_clients/sabnzbd.rb"
    - "app/services/download_clients/transmission.rb"
    - "app/services/ebooks_com_client.rb"
