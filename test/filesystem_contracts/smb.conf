[global]
   server role = standalone server
   security = user
   map to guest = never
   server min protocol = SMB2_10
   server max protocol = SMB3
   smb ports = 445
   disable spoolss = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log file = /dev/stdout
   max log size = 0

[contracts]
   path = /share
   valid users = shelfarr
   read only = no
   browseable = yes
   force user = shelfarr
   create mask = 0777
   force create mode = 0600
   directory mask = 0777
   force directory mode = 0700
